<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            /* background: linear-gradient(135deg, #4966e6 0%, #56ffb0 100%); */
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .login-card {
            width: 440px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            animation: fadeInUp 0.6s ease;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header-custom {
            background: linear-gradient(135deg, #9ed758 0%, #6fb308 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
        }

        .admin-icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            backdrop-filter: blur(10px);
        }

        .admin-icon i {
            font-size: 1.8rem;
            color: white;
        }

        .card-header-custom h4 {
            color: white;
            font-weight: 600;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .card-body-custom {
            padding: 2.5rem 2.5rem 2rem;
        }

        .form-label {
            font-weight: 500;
            color: #6c757d;
            margin-bottom: 0.6rem;
            font-size: 0.875rem;
            letter-spacing: 0.2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            height: 50px;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .form-control:focus {
            border-color: #9ed758;
            box-shadow: 0 0 0 4px rgba(158, 215, 88, 0.1);
            outline: none;
        }

        .form-control:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: #9ed758;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #495057;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #9ed758 0%, #6fb308 100%);
            color: white;
            padding: 0.95rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            height: 52px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(158, 215, 88, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(158, 215, 88, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert-danger {
            background-color: #fee;
            border: 1px solid #fcc;
            border-radius: 10px;
            color: #c33;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            animation: shake 0.4s ease;
        }

        .alert-danger i {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .forgot-password {
            text-align: center;
            margin-top: 1.25rem;
        }

        .forgot-password a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s ease;
        }

        .forgot-password a:hover {
            color: #6fb308;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0 1rem;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            color: #adb5bd;
            font-size: 0.8rem;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .login-card {
                width: 90%;
                margin: 1rem;
            }

            .card-body-custom {
                padding: 2rem 1.5rem;
            }

            .card-header-custom {
                padding: 2rem 1.5rem;
            }
        }

        /* Accessibility improvements */
        .form-control:focus-visible {
            outline: 2px solid #9ed758;
            outline-offset: 2px;
        }

        .login-btn:focus-visible {
            outline: 2px solid #9ed758;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card">
        <div class="card-header-custom">
            <h4>Admin Portal</h4>
        </div>
        
        <div class="card-body-custom">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" id="loginForm">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_username">Username</label>
                    <input 
                        type="text" 
                        name="username" 
                        id="id_username"
                        class="form-control" 
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            name="password" 
                            id="id_password"
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_role">Login As</label>
                    <select name="role" id="id_role" class="form-control" required>
                        <option value="">Select Role</option>
                        <option value="Manager">Manager</option>
                        <option value="Supervisor">Supervisor</option>
                        <option value="Clerk">Clerk</option>
                        <option value="Customer">Customer</option>
                    </select>
                    <small id="roleHint" class="text-muted" style="display: none;"></small>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Login</span>
                </button>
            </form>

            <!-- <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div> -->

           
        </div>
    </div>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#id_password');
    const eyeIcon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // toggle the eye icon
        eyeIcon.classList.toggle('bi-eye');
        eyeIcon.classList.toggle('bi-eye-slash');
    });

    // Auto-fill role based on username
    const usernameField = document.querySelector('#id_username');
    const roleField = document.querySelector('#id_role');
    const roleHint = document.querySelector('#roleHint');
    let fetchTimeout = null;

    usernameField.addEventListener('blur', fetchUserRole);
    usernameField.addEventListener('input', function() {
        // Debounce: wait 500ms after user stops typing
        clearTimeout(fetchTimeout);
        fetchTimeout = setTimeout(fetchUserRole, 500);
    });

    function fetchUserRole() {
        const username = usernameField.value.trim();
        
        if (!username) {
            roleField.value = '';
            roleHint.style.display = 'none';
            return;
        }

        fetch(`/get-user-role/?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
                if (data.is_superuser) {
                    // Superuser can choose any role
                    roleHint.textContent = 'Admin user - you can select any role';
                    roleHint.style.display = 'block';
                    roleHint.className = 'text-info';
                } else if (data.role) {
                    // Auto-select the user's role
                    roleField.value = data.role;
                    roleHint.textContent = `Role auto-filled: ${data.role}`;
                    roleHint.style.display = 'block';
                    roleHint.className = 'text-success';
                } else {
                    // No role found or user doesn't exist
                    roleField.value = '';
                    roleHint.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error fetching role:', error);
                roleHint.style.display = 'none';
            });
    }
</script>

</body>
</html>
