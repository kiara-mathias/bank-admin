<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* Map Django message levels to colors */
    .alert-error, .alert-danger {
        background-color: #f8d7da;
        color: #842029;
        padding: 0.75rem 1rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
    }

    .alert-success {
        background-color: #d1e7dd;
        color: #0f5132;
        padding: 0.75rem 1rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
    }

    .alert-info {
        background-color: #cff4fc;
        color: #055160;
        padding: 0.75rem 1rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
    }
</style>

</head>
<body>
    {% if request.user.is_authenticated %}
    <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        
        <!-- LEFT GROUP: Home + other left elements -->
        <div class="d-flex align-items-center gap-2">
            <a class="navbar-brand" href="{% url 'user_list' %}">
                <i class="bi bi-house"></i>
            </a>
                 {% block navbar_actions_left %}
            <!-- Add User button or other actions -->
                {% endblock %}
        </div>

        <!-- RIGHT GROUP: buttons / actions -->
        <div class="d-flex align-items-center gap-2">
            {% block navbar_actions_right %}
            <!-- Add User button or other actions -->
            {% endblock %}
        </div>

    </div>
</nav>
{% endif %}



    
    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 1000); // auto close after 2 seconds
</script>

</body>
</html>
